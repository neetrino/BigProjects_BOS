<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOON Expo 2026 — Venue map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Noto+Sans+Armenian:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#192643; --sea:#027691;
  --bg:#eef1f4; --panel:#ffffff; --ink:#192643; --ink-2:#5b6680; --line:#e1e5ec;
  --chip:#f0f3f7; --chip-on:#027691; --chip-on-ink:#fff; --hover:#eaf3f6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --panel:#141d33; --ink:#eef2f8; --ink-2:#9fabc4; --line:#26314d;
    --chip:#1d2843; --chip-on:#0a8fae; --chip-on-ink:#fff; --hover:#1c2a46; --bg:#0f1628;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --panel:#141d33; --ink:#eef2f8; --ink-2:#9fabc4; --line:#26314d;
  --chip:#1d2843; --chip-on:#0a8fae; --chip-on-ink:#fff; --hover:#1c2a46; --bg:#0f1628;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"Montserrat","Noto Sans Armenian",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;background:#eef1f4;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;cursor:grab}
#stage.dragging canvas{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform-origin:0 0;white-space:normal;overflow-wrap:break-word;
  font-size:12px;font-weight:600;color:#192643;
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;will-change:transform;display:none;text-align:center;line-height:1.15}
.lbl .sq{display:block;font-weight:500;font-size:.76em;color:#027691;margin-top:2px}
.lbl.nosq .sq{display:none}
.lbl.open{color:#8b95a8;font-weight:500}
.lbl.open .sq{color:#8b95a8}
.lbl.big{font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.lbl.pill{background:#fff;border:1px solid #c9d3df;border-radius:4px;padding:2px 6px;font-size:10px;font-weight:600;color:#192643;text-shadow:none;white-space:nowrap}
.lbl.zone{font-size:18px;font-weight:800;color:rgba(2,118,145,.55);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;text-shadow:none}
.lbl.poi{width:32px;height:32px;border-radius:6px;background:#027691;color:#fff;
  display:none;align-items:center;justify-content:center;font-weight:800;font-size:18px;text-shadow:none}
.lbl.sel{background:#192643;color:#fff;text-shadow:none;padding:5px 10px;border-radius:5px;font-size:13px!important;width:auto!important;white-space:nowrap;text-transform:none;font-weight:700}
.lbl.sel .sq{color:#7fd0e3}
.lbl.draw-sq{background:#192643;color:#fff;text-shadow:none;padding:6px 12px;border-radius:6px;
  font-size:16px!important;font-weight:800;white-space:nowrap;width:auto!important;letter-spacing:.01em}

/* panel */
#panel{position:fixed;z-index:5;top:calc(16px + env(safe-area-inset-top,0px));left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:330px;background:var(--panel);border-radius:10px;
  box-shadow:0 1px 2px rgba(25,38,67,.08),0 10px 34px rgba(25,38,67,.16);display:flex;flex-direction:column;overflow:hidden}
.brand{position:relative;background:#192643;color:#fff;padding:18px 18px 0;overflow:hidden}
.brand .row{display:flex;gap:14px;align-items:center}
.brand img{width:76px;height:auto;display:block;flex:none}
.brand h1{margin:0;font-size:21px;line-height:1.05;font-weight:800;text-transform:uppercase;letter-spacing:.005em}
.brand p{margin:6px 0 0;font-size:12.5px;line-height:1.35;color:#c4cde0;font-weight:500}
.brand .date{display:inline-block;margin-top:8px;background:#027691;color:#fff;font-size:12px;font-weight:700;padding:4px 8px;border-radius:3px}
.brand svg.sky{display:block;width:calc(100% + 36px);margin:8px -18px 0;height:auto}
.tools{padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:14px;font-weight:500;padding:10px 12px 10px 36px;border-radius:6px;
  border:1px solid var(--line);background:var(--chip);color:var(--ink);outline:none}
.search input::placeholder{color:var(--ink-2)}
.search input:focus-visible{border-color:var(--sea);box-shadow:0 0 0 3px rgba(2,118,145,.18)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font:inherit;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:4px;border:0;
  background:var(--chip);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.chip:focus-visible,.item:focus-visible,.ctl button:focus-visible,#card button:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
#list{flex:1;overflow:auto;padding:4px 8px 10px}
.grp{font-size:12px;color:var(--sea);padding:14px 10px 4px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;
  font-size:14px;font-weight:500;background:none;border:0;color:var(--ink);padding:8px 10px;border-radius:5px;cursor:pointer}
.item:hover{background:var(--hover)}
.item.on{background:#192643;color:#fff}
.item small{color:inherit;opacity:.6;font-size:12px;font-weight:600;white-space:nowrap}
.item.open-b span{color:var(--ink-2)}
.empty{padding:16px 10px;color:var(--ink-2);font-size:14px}
.foot{border-top:1px solid var(--line);padding:12px 18px 14px;font-size:12px;color:var(--ink-2)}
.foot h3{margin:0 0 6px;font-size:12px;font-weight:800;color:var(--ink);text-transform:uppercase;letter-spacing:.04em}
.foot dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.foot dt{background:var(--chip);color:var(--ink);font-weight:600;padding:2px 7px;border-radius:3px}
.foot dd{margin:0;color:var(--ink);font-weight:600;text-align:right}
.foot a{color:var(--sea);font-weight:600;text-decoration:none;display:inline-block;margin-top:8px}
.foot a:hover{text-decoration:underline}

/* selected card */
#card{position:fixed;z-index:6;left:362px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--panel);color:var(--ink);
  border-radius:8px;padding:14px 44px 14px 18px;min-width:240px;max-width:340px;box-shadow:0 10px 34px rgba(25,38,67,.2);display:none;border-left:5px solid #027691}
#card h2{margin:0;font-size:18px;font-weight:800}
#card p{margin:4px 0 0;font-size:13px;color:var(--ink-2);font-weight:500}
#card button{position:absolute;top:8px;right:8px;border:0;background:none;color:var(--ink-2);font-size:18px;cursor:pointer;width:28px;height:28px;border-radius:4px}
#card button:hover{background:var(--hover)}

/* map controls */
.ctl{position:fixed;z-index:5;right:16px;top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
.ctl button{width:42px;height:42px;border:0;border-radius:6px;background:#192643;color:#fff;
  box-shadow:0 2px 10px rgba(25,38,67,.2);font:inherit;font-weight:700;font-size:15px;cursor:pointer;display:grid;place-items:center}
.ctl button:hover{background:#027691}
.hint{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:12px;font-weight:500;color:#5b6680;z-index:4;text-align:right}
#tilt{display:none}
body.bos-embed #panel,body.bos-embed .hint{display:none!important}
body.bos-embed #card{display:none!important}

@media (max-width:760px){
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:46%;border-radius:12px 12px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .brand{padding:12px 16px 0}
  .brand img{width:52px}
  .brand h1{font-size:17px}
  .brand p{display:none}
  .brand svg.sky{margin-top:4px;width:calc(100% + 32px);margin-left:-16px}
  .tools{padding:10px 16px}
  .foot{display:none}
  #card{left:12px;right:12px;bottom:calc(46% + 10px);max-width:none}
  .hint{display:none}
  .ctl{right:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function rebuildBoothMeshes(b){

function syncBoothMeshes(b){

  const h=b.name?b.h:.6;
  b.parts.forEach(function(p,i){
    const mesh=b.meshes[i];

  const x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs)+1;

  const p=b.main;
  if(p&&p[0]===x0&&p[1]===z0&&p[2]===x1&&p[3]===z1) return;

  rebuildBoothMeshes(b);
}

    i:area.id, id:area.id, areaId:area.id, name:area.name, sqm, zone:"Main hall", kind:"",
    parts, main:parts[0], note:null, occupied:!!area.occupied,

}

    code:String(b.id),
    areaId:b.areaId||null,
    cells:rectCells(p[0],p[1],p[2]-0.01,p[3]-0.01),
    dirty:!!b.dirty
  };
}
function postCatalog(){
  postParent({type:"bos-catalog",booths:B.map(serializeBooth)});
}
function commitBoothChange(b){
  b.dirty=true;
  select(b,false,true);
  postParent({type:"bos-moved",areaId:b&&b.areaId?b.areaId:null,booth:b?serializeBooth(b):null});
  postCatalog();
}
function clearDirtyBooths(){
  B.forEach(function(b){ b.dirty=false; });
  postCatalog();
}
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerdown",e=>{
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  moved=0; last={x:e.clientX,y:e.clientY}; drawStart=null;
  if(ptrs.size===2){ mode="pinch"; pinch=pinchState(); stage.classList.add("dragging"); return; }
  const forcePan=bosTool!=="select"||e.button===2||e.shiftKey;
  const booth=hitAt(e.clientX,e.clientY);
  moveBooth=null; moveOrigin=null; moveParts=null;
  if(forcePan||booth){
    mode=booth&&!forcePan?"pick":"pan";
    if(mode==="pick"&&booth){
      moveBooth=booth;
      moveOrigin=floorAt(e.clientX,e.clientY);
      moveParts=cloneParts(booth.parts);
    }
  }
  else { const f=floorAt(e.clientX,e.clientY); mode=f?"draw":"pan"; drawStart=f; }
  if(mode!=="draw") stage.classList.add("dragging");
});
cv.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId)){ hoverAt(e.clientX,e.clientY); return; }
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(mode==="pinch"&&ptrs.size===2){ const p=pinchState(); setGoal({dist:goal.dist*pinch.d/p.d}); pan(p.cx-pinch.cx,p.cy-pinch.cy); pinch=p; moved+=10; return; }
  const dx=e.clientX-last.x, dy=e.clientY-last.y; last={x:e.clientX,y:e.clientY}; moved+=Math.abs(dx)+Math.abs(dy);
  if(mode==="draw"&&drawStart){
    const f=floorAt(e.clientX,e.clientY);
    if(f) setPreview(drawStart.xm,drawStart.zm,f.xm,f.zm);
    return;
  }
  if(mode==="pick"&&moved>=CLICK_MOVE_PX){
    mode=bosTool==="select"&&moveBooth&&moveOrigin?"move":"pan";
    if(mode==="move") select(moveBooth,false,true);
  }
  if(mode==="move"&&moveBooth&&moveOrigin&&moveParts){
    const f=floorAt(e.clientX,e.clientY);
    if(!f) return;
    const mx=snapMeter(f.xm-moveOrigin.xm), mz=snapMeter(f.zm-moveOrigin.zm);
    moveBooth.parts=movePartsBy(moveParts,mx,mz);
    moveBooth.main=moveBooth.parts[0];
    syncBoothMeshes(moveBooth);
    cv.style.cursor="grabbing";
    return;
  }
  if(mode==="pan"||mode==="rot") pan(dx,dy);
});
function endPtr(e){
  const wasClick=ptrs.size===1&&moved<CLICK_MOVE_PX; ptrs.delete(e.pointerId);
  if(ptrs.size===0){
    stage.classList.remove("dragging");
    if(mode==="move"&&moveBooth){
      commitBoothChange(moveBooth);
    } else if(mode==="draw"&&drawStart){
      const f=floorAt(e.clientX,e.clientY)||drawStart;
      const cells=wasClick?defaultCells(drawStart.xm,drawStart.zm):rectCells(drawStart.xm,drawStart.zm,f.xm,f.zm);
      clearPreview();
      if(cells.length) postParent({type:"bos-selection",cells});
    } else if(wasClick){
      select(hitAt(e.clientX,e.clientY),false);
    }
    mode=null; drawStart=null; moveBooth=null; moveOrigin=null; moveParts=null;
  } else if(ptrs.size===1){ const p=[...ptrs.values()][0]; last={x:p.x,y:p.y}; mode="pan"; }
}
cv.addEventListener("pointerup",endPtr); cv.addEventListener("pointercancel",endPtr);
cv.addEventListener("wheel",e=>{ e.preventDefault(); setGoal({dist:goal.dist*Math.exp(e.deltaY*0.0012)}); },{passive:false});
function pinchState(){ const [a,b]=[...ptrs.values()]; return {d:Math.hypot(a.x-b.x,a.y-b.y)||1,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2}; }
function pan(dx,dy){ const k=goal.dist*0.0016, s=Math.sin(goal.az), c=Math.cos(goal.az);
  setGoal({tx:goal.tx-(dx*c+dy*s)*k, tz:goal.tz-(-dx*s+dy*c)*k}); }
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function hitAt(x,y){ const r=cv.getBoundingClientRect(); ndc.set(((x-r.left)/r.width)*2-1,-((y-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera); const h=ray.intersectObjects(meshes,false); return h.length?h[0].object.userData.b:null; }
let hovered=null;
function hoverAt(x,y){ const b=hitAt(x,y); if(b!==hovered){ hovered=b; cv.style.cursor=b?(bosTool==="select"?"grab":"pointer"):(bosTool==="select"?"crosshair":"grab"); paint(); } }

/* ---------- selection & filtering ---------- */
let selected=null, activeZone="All", query="";
function matches(b){
  const q=query.trim().toLowerCase();
  return (activeZone==="All"||b.zone===activeZone) && (!q || b.label.toLowerCase().includes(q));
}
function paint(){
  const filtering=activeZone!=="All"||query.trim();
  B.forEach(b=>{
    const ok=matches(b);
    let c=b.kind==="svc"?COL.svc:(b.name?(b.big?COL.big:COL.base):COL.open);
    if(b===hovered) c=COL.hover;
    if(b===selected) c=COL.sel;
    b.mat.color.setHex(c);
    b.dim=filtering&&!ok&&b!==selected;
    b.mat.opacity=b.dim?.25:1;
    b.liftGoal=b===selected?1.0:(b===hovered?0.3:0);
    b.el.classList.toggle("sel",b===selected);
  });
}
const card=document.getElementById("card"), cardT=document.getElementById("cardT"), cardS=document.getElementById("cardS");
function select(b,fly,silent){
  selected=b; paint(); renderList();
  if(!silent){
    postParent({
      type:"bos-select-area",
      areaId:b&&b.areaId?b.areaId:null,
      booth:b?serializeBooth(b):null
    });
  }
  if(!b){ card.style.display="none"; return; }
  cardT.textContent=b.name||"Open booth";
  cardS.textContent=[b.sqm?b.sqm+" m²":null,b.zone,b.note].filter(Boolean).join(", ");
  card.style.display="block";
  if(fly&&b.top) setGoal({tx:b.top.x,tz:b.top.z,dist:58,pol:flat?0.001:0.82});
}
function findBosBooth(id){
  return B.find(function(b){ return b.id===id||b.areaId===id||b.code===id; })||null;
}
document.getElementById("cardX").onclick=()=>select(null);

const chipsEl=document.getElementById("chips");
["All",...ZONES].forEach(z=>{
  const c=document.createElement("button"); c.className="chip"; c.textContent=z; c.setAttribute("aria-pressed",z==="All");
  c.onclick=()=>{ activeZone=z; [...chipsEl.children].forEach(x=>x.setAttribute("aria-pressed",x===c)); paint(); renderList(); };
  chipsEl.appendChild(c);
});
document.getElementById("q").addEventListener("input",e=>{ query=e.target.value; paint(); renderList(); });
const listEl=document.getElementById("list");
function renderList(){
  listEl.innerHTML=""; let any=false;
  ZONES.forEach(z=>{
    const items=B.filter(b=>b.zone===z&&matches(b)).sort((a,b)=>(!!b.name-!!a.name)||(a.label.localeCompare(b.label))||((b.sqm||0)-(a.sqm||0)));
    if(!items.length) return; any=true;
    const g=document.createElement("div"); g.className="grp"; g.textContent=z+" ("+items.length+")"; listEl.appendChild(g);
    items.forEach(b=>{
      const it=document.createElement("button"); it.className="item"+(b===selected?" on":"")+(b.name?"":" open-b");
      it.innerHTML="<span></span><small></small>"; it.firstChild.textContent=b.label; it.lastChild.textContent=b.sqm?b.sqm+" m²":"";
      it.onclick=()=>select(b,true); listEl.appendChild(it);
    });
  });
  if(!any){ const e=document.createElement("div"); e.className="empty"; e.textContent="No exhibitors match. Check the spelling or clear the zone filter."; listEl.appendChild(e); }
}

document.getElementById("zin").onclick=()=>setGoal({dist:goal.dist/1.35});
document.getElementById("zout").onclick=()=>setGoal({dist:goal.dist*1.35});
const tiltBtn=document.getElementById("tilt");
tiltBtn.onclick=()=>{ flat=!flat; setGoal({pol:flat?0.001:0.86}); if(flat) setGoal({az:0});
  tiltBtn.textContent=flat?"3D":"2D"; tiltBtn.setAttribute("aria-label",flat?"Switch to 3D view":"Switch to 2D view"); };
document.getElementById("reset").onclick=()=>{ setGoal(Object.assign({},HOME)); select(null); };
addEventListener("keydown",e=>{
  if(e.key==="Escape"){ select(null); return; }
  if(!selected||bosTool!=="select") return;
  const arrows={ArrowLeft:true,ArrowRight:true,ArrowUp:true,ArrowDown:true};
  if(!arrows[e.key]) return;
  e.preventDefault();
  if(e.shiftKey){
    const dw=e.key==="ArrowRight"?GRID_SNAP_M:(e.key==="ArrowLeft"?-GRID_SNAP_M:0);
    const dd=e.key==="ArrowDown"?GRID_SNAP_M:(e.key==="ArrowUp"?-GRID_SNAP_M:0);
    resizeBooth(selected,dw,dd);
  } else {
    const dx=e.key==="ArrowRight"?GRID_SNAP_M:(e.key==="ArrowLeft"?-GRID_SNAP_M:0);
    const dz=e.key==="ArrowDown"?GRID_SNAP_M:(e.key==="ArrowUp"?-GRID_SNAP_M:0);
    selected.parts=movePartsBy(selected.parts,dx,dz);
    selected.main=selected.parts[0];
    syncBoothMeshes(selected);
  }
  commitBoothChange(selected);
});
addEventListener("message",e=>{
  if(e.source!==window.parent) return;
  const d=e.data; if(!d||typeof d.type!=="string") return;
  if(d.type==="bos-fit") setGoal(Object.assign({},HOME));
  if(d.type==="bos-mode"&&(d.mode==="select"||d.mode==="pan"||d.mode==="calibrate")){
    bosTool=d.mode; cv.style.cursor=bosTool==="select"?"crosshair":"grab";
  }
  if(d.type==="bos-areas"&&Array.isArray(d.areas)){
    applyBosAreas(d.areas, d.selectedAreaId||null);
    postCatalog();
  }
  if(d.type==="bos-need-catalog") postCatalog();
  if(d.type==="bos-highlight"&&d.boothId){
    const next=findBosBooth(d.boothId);
    if(next) select(next,true,true);
  }
  if(d.type==="bos-clear-dirty") clearDirtyBooths();
});

/* ---------- render loop ---------- */
function resize(){ const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener("resize",resize); resize();
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const v=new THREE.Vector3(), tmp=new THREE.Vector3();
function proj(p){ v.copy(p).project(camera); return {x:(v.x+1)/2*stage.clientWidth,y:(1-v.y)/2*stage.clientHeight,z:v.z}; }
function screenW(b){
  const p=b.main, y=b.base+b.hh; let mn=1e9,mx=-1e9,my=1e9,My=-1e9;
  [[p[0],p[1]],[p[2],p[1]],[p[0],p[3]],[p[2],p[3]]].forEach(c=>{ tmp.set(W(c[0]),y,D(c[1])); const q=proj(tmp); mn=Math.min(mn,q.x); mx=Math.max(mx,q.x); my=Math.min(my,q.y); My=Math.max(My,q.y); });
  return {w:mx-mn,h:My-my};
}
function show(el,p,on){ if(!on||p.z>1){ el.style.display="none"; return false; } el.style.display=el.classList.contains("poi")?"flex":"block"; return true; }
function loop(){
  const k=reduce?1:0.14;
  for(const key in goal) cur[key]+=(goal[key]-cur[key])*k;
  applyCam();
  B.forEach(b=>{ b.lift+=(b.liftGoal-b.lift)*(reduce?1:0.2); b.meshes.forEach(m=>m.position.y=b.base+b.hh/2+b.lift); });
  renderer.render(scene,camera);

  B.forEach(b=>{
    const s=screenW(b); const top=b.top.clone(); top.y+=b.lift+.05; const p=proj(top);
    const isSel=b===selected;
    const on = isSel || (!b.dim && (b.name ? s.w>30 && s.h>10 : s.w>40 && s.h>14));
    if(!show(b.el,p,on)) return;
    if(!isSel){
      const fs=clamp(Math.min(s.w/(b.big?8.5:7.8), s.h/2.6), 8, b.big?20:14);
      b.el.style.fontSize=fs+"px";
      b.el.style.width=Math.max(30,s.w*.94)+"px";
      b.el.classList.toggle("nosq", s.h<fs*3.4);
    } else { b.el.classList.remove("nosq"); }
    b.el.style.transform=`translate(${p.x}px,${p.y}px) translate(-50%,-50%)`;
  });
  extras.forEach(e=>{
    const p=proj(e.p); const visible = !e.min || cur.dist<e.min;
    if(!show(e.el,p,visible)) return;
    const sc=e.zoom?clamp(420/cur.dist,.6,1.6):1;
    e.el.style.transform=`translate(${p.x}px,${p.y}px) translate(-50%,-50%) scale(${sc})`;
  });
  if(previewTop){
    const p=proj(previewTop);
    if(show(previewSizeEl,p,true)){
      previewSizeEl.style.transform=`translate(${p.x}px,${p.y}px) translate(-50%,-50%)`;
    }
  }
  requestAnimationFrame(loop);
}
paint(); renderList(); loop();
postParent({type:"bos-ready"});
postCatalog();
})();
</script>
</body>
