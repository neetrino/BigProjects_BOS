services:
  postgres:
    image: postgres:18
    container_name: bos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bos
    ports:
      - '5433:5432'
    volumes:
      # Postgres 18 images expect the mount at /var/lib/postgresql (not .../data).
      - bos_postgres_data:/var/lib/postgresql

  minio:
    image: minio/minio
    container_name: bos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - bos_minio_data:/data

volumes:
  bos_postgres_data:
  bos_minio_data:
